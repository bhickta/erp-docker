name: ${COMPOSE_PROJECT_NAME:-frappe_development}

services:
  mariadb:
    image: docker.io/mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-123}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: docker.io/redis:alpine

  redis-queue:
    image: docker.io/redis:alpine

  frappe:
    image: docker.io/frappe/bench:latest
    user: root
    init: true
    command: ["bash", "/workspace/.devcontainer/start-development.sh"]
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    environment:
      APPS_JSON: ${APPS_JSON:-}
      SITES_JSON: ${SITES_JSON:-}
      BACKUP_URL: ${BACKUP_URL:-}
      CODEX_HOME: /opt/host-cli/state/codex
      HOST_CLI_PATH: /home/frappe/.host-cli/bin
      SHELL: /bin/bash
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-1212}
      DB_PASSWORD: ${DB_PASSWORD:-123}
      FRAPPE_API_TOKEN: ${FRAPPE_API_TOKEN:-}
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
      # Select the matching key from a multi-key host agent. GitHub accepts the
      # first valid account key, which can otherwise authenticate as the wrong
      # account and report private repositories as missing.
      GIT_SSH_COMMAND: ssh -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityFile=/home/frappe/.ssh/git-identity.pub
      SOURCE_SITE_URL: ${SOURCE_SITE_URL:-}
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    volumes:
      - ..:/workspace:cached
      # Share host-installed user CLIs without exposing the entire host home.
      - ${HOME}/.cargo/bin:/opt/host-cli/cargo/bin:ro
      - ${HOME}/.local/bin:/opt/host-cli/local/bin:ro
      - ${HOME}/.nvm:/opt/host-cli/nvm:ro
      - ${HOME}/.codex:/opt/host-cli/state/codex
      - ${HOME}/.tokensave:/opt/host-cli/state/tokensave
      # Reuse host SSH routing and agent authentication without mounting keys.
      - ${SSH_AUTH_SOCK:-/dev/null}:/run/host-services/ssh-auth.sock
      - ${HOME}/.ssh/config:/home/frappe/.ssh/config:ro
      - ${HOME}/.ssh/known_hosts:/home/frappe/.ssh/known_hosts:ro
      # A public key lets OpenSSH select its matching private key from the
      # forwarded agent; the private key itself remains on the host.
      - ${GIT_IDENTITY_PUBLIC_KEY:-${HOME}/.ssh/bhickta.pem.pub}:/home/frappe/.ssh/git-identity.pub:ro
      # Host-built ELF CLIs may require a newer glibc than the image provides.
      - /lib/x86_64-linux-gnu:/opt/host-cli/lib:ro
    working_dir: /workspace/development
    ports:
      - "${HTTP_PORT:-8000}:8000"
      - "${SOCKETIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/frappe-bench-setup-complete"]
      start_period: 30m
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mariadb-data:
